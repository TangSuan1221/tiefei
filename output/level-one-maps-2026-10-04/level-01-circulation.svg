<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1240" viewBox="0 0 1800 1240"><defs><pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse"><path d="M60 0H0V60" fill="none" stroke="#23414e" stroke-width=".7"/></pattern><marker id="cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#63dafa"/></marker><marker id="green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#79e2b1"/></marker><marker id="red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#ef797d"/></marker><marker id="amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#f5c270"/></marker></defs><rect width="1800" height="1240" fill="#09151e"/><g font-family="Microsoft YaHei, sans-serif"><text x="60" y="57" font-size="17" fill="#63dafa" letter-spacing="4">IRON LUNG / LEVEL 01</text><text x="60" y="111" font-size="38" fill="#e2edf0" font-weight="700">第一关 · 三方动线图</text><text x="60" y="151" font-size="18" fill="#8ba7b5" >与俯视图采用同一坐标底图 / 蓝：玩家进港 / 黄：作业往返 / 绿：人员撤离 / 红：怪物</text><rect x="50" y="194" width="1140" height="705" fill="url(#grid)" stroke="none" stroke-width="2"/><rect x="1220" y="194" width="520" height="960" fill="#10232e" stroke="none" stroke-width="2"/><polyline points="212,470 212,494 218,512 224,518 236,530 254,536 272,542 284,554 290,560 296,578 296,590" fill="none" stroke="#71909d" stroke-width="112" stroke-linejoin="round" stroke-linecap="round" /><polyline points="212,470 212,494 218,512 224,518 236,530 254,536 272,542 284,554 290,560 296,578 296,590" fill="none" stroke="#183b4c" stroke-width="106" stroke-linejoin="round" stroke-linecap="round" /><rect x="344" y="608" width="120" height="84" fill="#183b4c" stroke="#71909d" stroke-width="3"/><rect x="80" y="230" width="264" height="240" fill="#183b4c" stroke="#71909d" stroke-width="3"/><rect x="80" y="590" width="264" height="240" fill="#183b4c" stroke="#71909d" stroke-width="3"/><rect x="464" y="230" width="672" height="480" fill="#183b4c" stroke="#71909d" stroke-width="3"/><rect x="164" y="466.4" width="96" height="8" fill="#183b4c" stroke="none" stroke-width="2"/><rect x="248" y="586.4" width="96" height="8" fill="#183b4c" stroke="none" stroke-width="2"/><rect x="341.6" y="610.4" width="132" height="79.19999999999999" fill="#183b4c" stroke="none" stroke-width="2"/><rect x="482" y="260" width="636" height="151.2" fill="#273b3b" stroke="#71909d" stroke-width="3"/><rect x="916.4000000000001" y="245.6" width="183.60000000000002" height="176.39999999999998" fill="#432f35" stroke="#71909d" stroke-width="3"/><line x1="947.5999999999999" y1="422" x2="1060.4" y2="422" stroke="#f5c270" stroke-width="6" /><line x1="464" y1="446" x2="1136" y2="446" stroke="#ef797d" stroke-width="5" stroke-dasharray="8 5"/><rect x="777.2" y="398" width="45.599999999999994" height="21.6" fill="#758787" stroke="#71909d" stroke-width="3"/><rect x="779.5999999999999" y="489.20000000000005" width="40.8" height="19.200000000000003" fill="#758787" stroke="#71909d" stroke-width="3"/><rect x="706.4000000000001" y="311.6" width="19.200000000000003" height="32.400000000000006" fill="#32564b" stroke="#71909d" stroke-width="3"/><line x1="706.4000000000001" y1="344" x2="725.5999999999999" y2="344" stroke="#79e2b1" stroke-width="4" /><line x1="158" y1="482" x2="266" y2="482" stroke="#f5c270" stroke-width="6" /><line x1="404" y1="608" x2="404" y2="692" stroke="#f5c270" stroke-width="6" /><text x="104" y="266" font-size="22" fill="#e2edf0" >A  检查气闸</text><text x="104" y="296" font-size="15" fill="#8ba7b5" >22 × 20 m</text><text x="104" y="758" font-size="21" fill="#e2edf0" >C  岸电维修湾</text><text x="104" y="794" font-size="15" fill="#8ba7b5" >22 × 20 m</text><text x="488" y="686" font-size="21" fill="#8ba7b5" >B  主港救援区 · 56 × 40 m</text><text x="500" y="290" font-size="20" fill="#79e2b1" >北侧维修平台</text><text x="932" y="280.4" font-size="19" fill="#f5c270" >隔离货仓</text><text x="488" y="477.20000000000005" font-size="17" fill="#ef797d" >断裂隔断：可摄影，艇体不可通过</text><circle cx="764" cy="362" r="16" fill="#09151e" stroke="#79e2b1" stroke-width="3"/><text x="764" y="368" font-size="17" fill="#79e2b1" text-anchor="middle" font-weight="700">人</text><circle cx="848" cy="338" r="16" fill="#09151e" stroke="#ef797d" stroke-width="3"/><text x="848" y="344" font-size="17" fill="#ef797d" text-anchor="middle" font-weight="700">怪</text><text x="671.5999999999999" y="294.8" font-size="16" fill="#79e2b1" >内侧逃生门</text><text x="116" y="518" font-size="16" fill="#f5c270" >压力门 1</text><text x="356" y="590" font-size="16" fill="#f5c270" >压力门 2</text><circle cx="212" cy="350" r="16" fill="#09151e" stroke="#63dafa" stroke-width="3"/><text x="212" y="356" font-size="17" fill="#63dafa" text-anchor="middle" font-weight="700">S</text><text x="116" y="398" font-size="15" fill="#63dafa" >起点 (11, 0, 10)</text><circle cx="800" cy="554" r="16" fill="#09151e" stroke="#63dafa" stroke-width="3"/><text x="800" y="560" font-size="17" fill="#63dafa" text-anchor="middle" font-weight="700">01</text><rect x="826" y="520.84" width="8" height="8" fill="#f5c270" stroke="none" stroke-width="2"/><circle cx="584" cy="566" r="16" fill="#09151e" stroke="#f5c270" stroke-width="3"/><text x="584" y="572" font-size="17" fill="#f5c270" text-anchor="middle" font-weight="700">02</text><rect x="610" y="532.84" width="8" height="8" fill="#f5c270" stroke="none" stroke-width="2"/><circle cx="1016" cy="542" r="16" fill="#09151e" stroke="#63dafa" stroke-width="3"/><text x="1016" y="548" font-size="17" fill="#63dafa" text-anchor="middle" font-weight="700">03</text><rect x="1042" y="508.84000000000003" width="8" height="8" fill="#f5c270" stroke="none" stroke-width="2"/><line x1="1145" y1="277" x2="1145" y2="222" stroke="#e2edf0" stroke-width="2" marker-end="url(#cyan)"/><text x="1120" y="213" font-size="15" fill="#8ba7b5" >N / −Z</text><line x1="80" y1="865" x2="200" y2="865" stroke="#e2edf0" stroke-width="4" /><line x1="80" y1="858" x2="80" y2="872" stroke="#e2edf0" stroke-width="2" /><line x1="200" y1="858" x2="200" y2="872" stroke="#e2edf0" stroke-width="2" /><text x="80" y="890" font-size="15" fill="#8ba7b5" >0                  10 m</text><polyline points="212,350 212,470 212,494 218,512 224,518 236,530 254,536 272,542 284,554 290,560 296,578 296,650 464,650 800,650 800,554" fill="none" stroke="#63dafa" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#cyan)"/><polyline points="584,566 584,614 800,614 1016,614 1016,542" fill="none" stroke="#f5c270" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-start="url(#amber)" marker-end="url(#amber)"/><polyline points="800,554 800,614" fill="none" stroke="#f5c270" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-start="url(#amber)" marker-end="url(#amber)"/><polyline points="764,362 716,362 716,332" fill="none" stroke="#79e2b1" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#green)"/><polyline points="848,338 884,338 896,434 968,434 1004,422 1004,338" fill="none" stroke="#ef797d" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="7 5" marker-end="url(#red)"/><text x="836" y="306.8" font-size="16" fill="#ef797d" >诱导方向*</text><text x="524" y="644" font-size="17" fill="#f5c270" >02 ↔ 01 ↔ 03：按右侧步骤往返</text><text x="1250" y="239" font-size="23" fill="#63dafa" font-weight="700">01  进港与建立联系</text><text x="1250" y="273" font-size="18" fill="#e2edf0" >S → A-C压力门 → C → C-B压力门</text><text x="1250" y="300" font-size="18" fill="#e2edf0" >进B后调频收听38.4 kHz并应答</text><text x="1250" y="327" font-size="18" fill="#e2edf0" >到01，朝北拍摄并核验被困现场</text><text x="1250" y="388" font-size="23" fill="#f5c270" font-weight="700">02  恢复供电，打开货仓</text><text x="1250" y="422" font-size="18" fill="#e2edf0" >01 → 02：F恢复配电 / 补给</text><text x="1250" y="449" font-size="18" fill="#e2edf0" >02 → 01：F打开货仓闸机</text><text x="1250" y="508" font-size="23" fill="#f5c270" font-weight="700">03  引怪入仓，再返回隔离</text><text x="1250" y="542" font-size="18" fill="#e2edf0" >01 → 03：主动脉冲诱导约9秒</text><text x="1250" y="569" font-size="18" fill="#e2edf0" >完成5秒入仓曝光后停止脉冲</text><text x="1250" y="596" font-size="18" fill="#e2edf0" >03 → 01：F落闸；入仓窗口180秒</text><text x="1250" y="657" font-size="23" fill="#79e2b1" font-weight="700">04  核验隔离，放行人员</text><text x="1250" y="691" font-size="18" fill="#e2edf0" >01 → 03：拍摄闭闸与仓内怪物</text><text x="1250" y="718" font-size="18" fill="#e2edf0" >核验后03 → 01：接通内侧逃生门</text><text x="1250" y="745" font-size="18" fill="#e2edf0" >艾里亚斯 → 内侧门后（约10秒）</text><text x="1250" y="806" font-size="23" fill="#79e2b1" font-weight="700">05  确认救援，分路离开</text><text x="1250" y="840" font-size="18" fill="#e2edf0" >留在01拍撤离结果，显影并核验</text><text x="1250" y="867" font-size="18" fill="#e2edf0" >01面板确认 → 艇内离港操作</text><text x="1250" y="894" font-size="18" fill="#e2edf0" >两人分路；后续会合未画作已实现</text><text x="1250" y="955" font-size="23" fill="#f5c270" font-weight="700">补救与声音规则</text><text x="1250" y="989" font-size="18" fill="#e2edf0" >未确认入仓 / 超时：重新开闸诱导</text><text x="1250" y="1016" font-size="18" fill="#e2edf0" >02可回访补给；读片在艇内完成</text><text x="1250" y="1043" font-size="18" fill="#e2edf0" >仅实际发射脉冲产生诱敌噪声</text><text x="1250" y="1070" font-size="18" fill="#e2edf0" >声纳屏幕通电、停发可保持静默</text><text x="60" y="947" font-size="25" fill="#e2edf0" font-weight="700">动线解释与已知缺口</text><text x="60" y="990" font-size="20" fill="#e2edf0" >黄线表示往返共用航道，不表示一次性经过；实际顺序见右侧01—05。</text><text x="60" y="1027" font-size="19" fill="#ef797d" >* 红虚线是绕开仓壁、从南闸入仓的设计意图，未作为已实现寻路标注。</text><text x="60" y="1061" font-size="19" fill="#ef797d" >当前代码直接从(64,9)插值到(77,9)，会穿越货仓西墙；此处为GAP。</text><text x="60" y="1095" font-size="19" fill="#e2edf0" >当前图为实现提取与缺口说明；摄影5秒、显影至少12秒，不能边拍边驾驶。</text><text x="60" y="1190" font-size="16" fill="#8ba7b5" >依据：harbor-level.ts · harbor-rescue-world.ts · harbor-rescue-site.ts · MET-001—040｜2026-10-04</text><text x="60" y="1218" font-size="16" fill="#8ba7b5" >正式入口 / · main-authored · X/Z 等比例功能平面；墙体、标记及局部通道轮廓简化，非逐碰撞网格测绘。</text></g></svg>