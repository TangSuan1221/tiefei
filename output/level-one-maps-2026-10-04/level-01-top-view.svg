ill="#8ba7b5" >B  主港救援区 · 56 × 40 m</text><text x="500" y="290" font-size="20" fill="#79e2b1" >北侧维修平台</text><text x="932" y="280.4" font-size="19" fill="#f5c270" >隔离货仓</text><text x="488" y="477.20000000000005" font-size="17" fill="#ef797d" >断裂隔断：可摄影，艇体不可通过</text><circle cx="764" cy="362" r="16" fill="#09151e" stroke="#79e2b1" stroke-width="3"/><text x="764" y="368" font-size="17" fill="#79e2b1" text-anchor="middle" font-weight="700">人</text><circle cx="848" cy="338" r="16" fill="#09151e" stroke="#ef797d" stroke-width="3"/><text x="848" y="344" font-size="17" fill="#ef797d" text-anchor="middle" font-weight="700">怪</text><text x="671.5999999999999" y="294.8" font-size="16" fill="#79e2b1" >内侧逃生门</text><text x="116" y="518" font-size="16" fill="#f5c270" >压力门 1</text><text x="356" y="590" font-size="16" fill="#f5c270" >压力门 2</text><circle cx="212" cy="350" r="16" fill="#09151e" stroke="#63dafa" stroke-width="3"/><text x="212" y="356" font-size="17" fill="#63dafa" text-anchor="middle" font-weight="700">S</text><text x="116" y="398" font-size="15" fill="#63dafa" >起点 (11, 0, 10)</text><circle cx="800" cy="554" r="16" fill="#09151e" stroke="#63dafa" stroke-width="3"/><text x="800" y="560" font-size="17" fill="#63dafa" text-anchor="middle" font-weight="700">01</text><rect x="826" y="520.84" width="8" height="8" fill="#f5c270" stroke="none" stroke-width="2"/><circle cx="584" cy="566" r="16" fill="#09151e" stroke="#f5c270" stroke-width="3"/><text x="584" y="572" font-size="17" fill="#f5c270" text-anchor="middle" font-weight="700">02</text><rect x="610" y="532.84" width="8" height="8" fill="#f5c270" stroke="none" stroke-width="2"/><circle cx="1016" cy="542" r="16" fill="#09151e" stroke="#63dafa" stroke-width="3"/><text x="1016" y="548" font-size="17" fill="#63dafa" text-anchor="middle" font-weight="700">03</text><rect x="1042" y="508.84000000000003" width="8" height="8" fill="#f5c270" stroke="none" stroke-width="2"/><text x="500" y="602" font-size="17" fill="#f5c270" >配电 / 补给</text><text x="728" y="590" font-size="17" fill="#63dafa" >观察 / 闸控</text><text x="956" y="578" font-size="17" fill="#63dafa" >诱导 / 摄影</text><polyline points="800,554 764,362" fill="none" stroke="#63dafa" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="5 5"/><polyline points="1016,542 1004,338" fill="none" stroke="#63dafa" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="5 5"/><text x="848" y="518" font-size="15" fill="#ef797d" >断桥缺口</text><polyline points="212,422 212,446" fill="none" stroke="#63dafa" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#cyan)"/><text x="92" y="446" font-size="15" fill="#63dafa" >入口航点 Z16</text><line x1="1145" y1="277" x2="1145" y2="222" stroke="#e2edf0" stroke-width="2" marker-end="url(#cyan)"/><text x="1120" y="213" font-size="15" fill="#8ba7b5" >N / −Z</text><line x1="80" y1="865" x2="200" y2="865" stroke="#e2edf0" stroke-width="4" /><line x1="80" y1="858" x2="80" y2="872" stroke="#e2edf0" stroke-width="2" /><line x1="200" y1="858" x2="200" y2="872" stroke="#e2edf0" stroke-width="2" /><text x="80" y="890" font-size="15" fill="#8ba7b5" >0                  10 m</text><text x="1250" y="239" font-size="23" fill="#63dafa" font-weight="700">01  观察与总控</text><text x="1250" y="273" font-size="18" fill="#e2edf0" >艇位：X60 / Y0 / Z27</text><text x="1250" y="300" font-size="18" fill="#e2edf0" >初次调查与撤离结果摄影</text><text x="1250" y="327" font-size="18" fill="#e2edf0" >开货仓闸 → 落闸 → 接通逃生门</text><text x="1250" y="354" font-size="18" fill="#e2edf0" >撤离核验后，在此确认离港</text><text x="1250" y="416" font-size="23" fill="#f5c270" font-weight="700">02  配电与补给</text><text x="1250" y="450" font-size="18" fill="#e2edf0" >艇位：X42 / Y0 / Z28</text><text x="1250" y="477" font-size="18" fill="#e2edf0" >先完成首次摄影核验，再恢复供电</text><text x="1250" y="504" font-size="18" fill="#e2edf0" >电力、氧气补给位</text><text x="1250" y="567" font-size="23" fill="#63dafa" font-weight="700">03  诱导与隔离摄影</text><text x="1250" y="601" font-size="18" fill="#e2edf0" >艇位：X78 / Y0 / Z26</text><text x="1250" y="628" font-size="18" fill="#e2edf0" >朝北发射主动脉冲，引怪入仓</text><text x="1250" y="655" font-size="18" fill="#e2edf0" >拍入仓证据 → 停脉冲 → 返回01</text><text x="1250" y="682" font-size="18" fill="#e2edf0" >落闸后再次来此拍摄隔离结果</text><text x="1250" y="744" font-size="23" fill="#79e2b1" font-weight="700">图例与空间边界</text><text x="1250" y="778" font-size="18" fill="#e2edf0" >蓝圈：潜艇泊位    黄方块：实体面板</text><text x="1250" y="805" font-size="18" fill="#e2edf0" >绿圈：艾里亚斯    红圈：怪物初位</text><text x="1250" y="832" font-size="18" fill="#e2edf0" >红虚线：断裂隔断，禁止艇体穿越</text><text x="1250" y="859" font-size="18" fill="#e2edf0" >蓝虚线：摄影目标方向，非通行路径</text><text x="1250" y="927" font-size="23" fill="#f5c270" font-weight="700">尺寸与实现边界</text><text x="1250" y="961" font-size="18" fill="#e2edf0" >艇体基准：2.8 × 5 × 3 m</text><text x="1250" y="988" font-size="18" fill="#e2edf0" >A—C 标称宽9 m；C—B 标称宽7 m</text><text x="1250" y="1015" font-size="18" fill="#e2edf0" >7 m低于MET-003普通主航道8 m要求</text><text x="1250" y="1042" font-size="18" fill="#e2edf0" >旧外围房间省略，不纳入本次救援链</text><text x="60" y="947" font-size="25" fill="#e2edf0" font-weight="700">阅读要点</text><text x="60" y="989" font-size="22" fill="#79e2b1" >潜艇始终在南侧作业；艾里亚斯沿北侧内路脱困，首关不登艇。</text><text x="60" y="1030" font-size="19" fill="#e2edf0" >摄影与F操作是两个位置要求：面板在泊位右前方，需真实接近至3.4 m内。</text><text x="60" y="1064" font-size="19" fill="#e2edf0" >照片记录曝光时的现场；断桥不会因救援完成而修复，也没有新增跨桥操作。</text><text x="60" y="1098" font-size="19" fill="#e2edf0" >离港为01确认后的艇内流程；图中不虚构通向下一关的实体出口。</text><text x="60" y="1190" font-size="16" fill="#8ba7b5" >依据：harbor-level.ts · harbor-rescue-world.ts · harbor-rescue-site.ts · MET-001—040｜2026-10-04</text><text x="60" y="1218" font-size="16" fill="#8ba7b5" >正式入口 / · main-authored · X/Z 等比例功能平面；墙体、标记及局部通道轮廓简化，非逐碰撞网格测绘。</text></g></svg>